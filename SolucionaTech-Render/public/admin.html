<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Panel técnico · SolucionaTech</title><script src="https://cdn.tailwindcss.com"></script></head><body class="min-h-screen bg-slate-100 text-slate-950"><section id="login" class="grid min-h-screen place-items-center bg-slate-950 px-5"><form class="w-full max-w-md rounded-3xl bg-white p-8"><div class="grid size-12 place-items-center rounded-2xl bg-blue-600 text-xl text-white">🔐</div><h1 class="mt-6 text-3xl font-black">Panel del técnico</h1><p class="mt-2 text-slate-500">Acceso privado de SolucionaTech.</p><label class="mt-7 grid gap-2 text-sm font-bold">Clave de acceso<input name="password" type="password" required autofocus class="h-11 rounded-xl border px-3 font-normal"></label><p class="error mt-3 hidden text-sm font-bold text-red-600"></p><button class="mt-5 h-11 w-full rounded-xl bg-blue-600 font-bold text-white">Acceder</button><a href="/" class="mt-5 block text-center text-sm text-slate-500">Volver a la web pública</a></form></section>
<main id="dashboard" class="hidden"><header class="sticky top-0 border-b bg-white"><div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-4"><div><b class="text-lg">Soluciona<span class="text-blue-600">Tech</span></b><p class="text-xs text-slate-500">Gestión privada de tickets</p></div><div class="flex gap-2"><button id="refresh" class="rounded-xl border px-4 py-2 text-sm font-bold">Actualizar</button><button id="logout" class="rounded-xl px-4 py-2 text-sm font-bold">Salir</button></div></div></header><div class="mx-auto max-w-7xl px-4 py-7"><div class="grid gap-3 rounded-2xl border bg-white p-4 sm:grid-cols-[1fr_200px_170px]"><input id="search" placeholder="Buscar cliente, teléfono o problema…" class="h-10 rounded-xl border px-3"><select id="statusFilter" class="h-10 rounded-xl border bg-white px-3"><option value="active">Activos / pendientes</option><option value="resolved">Resueltos</option><option value="all">Todos</option><option>Nuevo</option><option>Contactado</option><option>En curso</option><option>Esperando respuesta</option><option>Resuelto</option></select><select id="priorityFilter" class="h-10 rounded-xl border bg-white px-3"><option value="all">Toda prioridad</option><option>Urgente</option><option>Alta</option><option>Normal</option></select></div><div id="summary" class="mt-5 text-sm font-bold text-slate-500"></div><div id="tickets" class="mt-4 grid gap-4"></div></div></main><script src="/admin.js" defer></script></body></html>
